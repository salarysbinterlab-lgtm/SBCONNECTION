<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>อันดับทั้งหมด - SB Connect</title>
  <meta name="theme-color" content="#075f56" />
  <!--
    หน้านี้ถูกยุบเข้าไปอยู่ในแอปแล้ว

    ของเดิมเป็นหน้า HTML แยกที่อ่านข้อมูลจาก localStorage.sb_ranking_cache
    ซึ่งมีปัญหา 3 อย่าง
      1. ข้อมูลเป็นของเก่าค้างในเครื่อง ถ้ายังไม่เคยเปิดแท็บอันดับจะว่างเปล่า
      2. ออกจากแอปไปโหลดหน้าใหม่ทั้งหน้า เสียความรู้สึกของ PWA
      3. เอาชื่อพนักงานยัดเข้า innerHTML ตรง ๆ โดยไม่ escape

    ตอนนี้ย้ายไปอยู่ในแท็บอันดับของแอป ใช้ข้อมูลสดจากฐานข้อมูล
    ค้นหาได้ กรองตามแผนกได้ และกระโดดไปที่อันดับตัวเองได้
    หน้านี้เหลือไว้เพื่อให้ลิงก์เก่าที่เคยส่งต่อกันยังใช้ได้
  -->
  <script>
    location.replace(new URL('./#ranking', location.href).href);
  </script>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
         font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#075f56;color:#fff}
    a{color:#99f6e4}
  </style>
</head>
<body>
  <p>กำลังพาไปที่หน้าอันดับในแอป… <a href="./#ranking">กดที่นี่ถ้าไม่ไปเอง</a></p>
</body>
</html>
